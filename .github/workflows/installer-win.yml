name: Installer (Windows x64)

# Builds a Windows x64 NSIS installer from a branch of this fork, so a
# modified build can be installed and tried without the release pipeline's
# signing secrets. It is NOT the release path: no updater artifacts are
# produced and nothing is published — the installer is a workflow artifact.
on:
  push:
    branches:
      - feat/continue-session
  workflow_dispatch:
    inputs:
      regression_only:
        description: Run delegation regression tests without rebuilding the installer
        type: boolean
        default: false
      server_only:
        description: Build only the selected server bundle
        type: boolean
        default: false
      server_platform:
        description: Server bundle platform (used with server_only)
        type: choice
        options:
          - windows-x64
          - linux-x64
        default: windows-x64

env:
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: installer-win-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-delegation:
    name: Delegation regression tests
    if: github.event_name != 'workflow_dispatch' || !inputs.server_only
    runs-on: ubuntu-22.04
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare memory and disk for Rust tests
        run: |
          # This server-only job does not use the runner's Android SDK.
          sudo rm -rf -- /usr/local/lib/android
          available_bytes=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1)
          if (( available_bytes < 24 * 1024 * 1024 * 1024 )); then
            echo "::error::Need at least 24 GiB free before allocating test swap"
            df -h "$RUNNER_TEMP"
            exit 1
          fi
          swap_file="$RUNNER_TEMP/codeg-regression.swap"
          sudo fallocate -l 8G "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
          swapon --show
          free -h
          df -h "$RUNNER_TEMP"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: test-ubuntu-22.04-server
      - name: Compile delegation tests
        working-directory: src-tauri
        run: |
          (
            while true; do
              date -u
              free -h
              df -h .
              ps -eo pid,comm,rss,pcpu --sort=-rss | sed -n '1,8p'
              cat /proc/pressure/memory
              sleep 30
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          /usr/bin/time -v cargo test --locked --no-default-features --features server-bin --lib --no-run
      - name: Run delegation tests
        working-directory: src-tauri
        run: |
          cargo test --locked --no-default-features --features server-bin --lib acp::delegation
          cargo test --locked --no-default-features --features server-bin --lib continuation_reuses_idle_connection_and_cancels_only_its_turn
          cargo test --locked --no-default-features --features server-bin --lib acp::lifecycle

  build-installer:
    name: Windows x64 NSIS installer
    if: github.event_name != 'workflow_dispatch' || (!inputs.regression_only && !inputs.server_only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: installer-x86_64-pc-windows-msvc

      - name: Test Windows process tree cleanup
        timeout-minutes: 10
        run: cargo test --manifest-path src-tauri/vendor/kill_tree/Cargo.toml --lib common::tests

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `bundle.createUpdaterArtifacts` is true in tauri.conf.json and the
      # updater artifacts it produces must be signed with the release
      # pipeline's TAURI_SIGNING_PRIVATE_KEY. This build has no such key and
      # does not need one: the installer is installed by hand, not updated.
      - name: Turn off updater artifacts for this build
        shell: pwsh
        run: |
          $path = 'src-tauri/tauri.conf.json'
          $text = Get-Content -Raw $path
          $patched = $text -replace '"createUpdaterArtifacts":\s*true', '"createUpdaterArtifacts": false'
          if ($patched -eq $text) {
            throw "bundle.createUpdaterArtifacts: true not found in $path"
          }
          Set-Content -NoNewline -Encoding utf8 -Path $path -Value $patched

      # `beforeBuildCommand` (pnpm tauri:before-build) runs the static export
      # build and stages the sidecars — codeg-mcp, codeg-computer-helper and
      # codeg-cli — for the host triple. MSI is not requested: with
      # `externalBin` configured, light.exe fails (tauri-apps/tauri#14681), so
      # NSIS is the Windows installer the release pipeline ships too.
      - name: Build installer
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: codeg-windows-x64-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  build-server:
    name: Windows x64 server bundle
    if: github.event_name == 'workflow_dispatch' && inputs.server_only && inputs.server_platform != 'linux-x64'
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: server-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build server and companions
        working-directory: src-tauri
        shell: pwsh
        run: |
          $features = @{
            'codeg-server' = 'server-bin'
            'codeg-mcp' = 'mcp-bin'
            'codeg-computer-helper' = 'computer-helper'
            'codeg-cli' = 'cli-bin'
          }
          foreach ($bin in @('codeg-server', 'codeg-mcp', 'codeg-computer-helper', 'codeg-cli')) {
            cargo build --locked --release --bin $bin --no-default-features --features $features[$bin] --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package and smoke test
        shell: pwsh
        run: |
          $bundle = 'dist/codeg-server-windows-x64'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          foreach ($bin in @('codeg-server', 'codeg-mcp', 'codeg-computer-helper', 'codeg-cli')) {
            Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/$bin.exe" "$bundle/"
          }
          Copy-Item -Recurse out "$bundle/web"
          & "$bundle/codeg-server.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mcpHelp = (& "$bundle/codeg-mcp.exe" --help) -join "`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($mcpHelp -notlike '*codeg-mcp --parent-connection-id*') { throw 'Unexpected MCP help' }
          $cliHelp = (& "$bundle/codeg-cli.exe" --help) -join "`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($cliHelp -notlike '*Usage: codeg-cli*') { throw 'Unexpected CLI help' }
          if (-not (Test-Path "$bundle/web/index.html")) { throw 'Web frontend missing' }
          Compress-Archive -Path $bundle -DestinationPath "$bundle.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$bundle.zip").Hash.ToLower()
          "$hash  codeg-server-windows-x64.zip" | Set-Content -Encoding ascii "$bundle.zip.sha256"

      - name: Upload server bundle
        uses: actions/upload-artifact@v4
        with:
          name: codeg-server-windows-x64
          path: |
            dist/codeg-server-windows-x64.zip
            dist/codeg-server-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  build-server-linux:
    name: Linux x64 server bundle
    if: github.event_name == 'workflow_dispatch' && inputs.server_only && inputs.server_platform == 'linux-x64'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: server-x86_64-unknown-linux-gnu

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build server and companions
        working-directory: src-tauri
        run: |
          set -euo pipefail
          for pair in codeg-server:server-bin codeg-mcp:mcp-bin codeg-computer-helper:computer-helper codeg-cli:cli-bin; do
            cargo build --locked --release --no-default-features --target x86_64-unknown-linux-gnu --bin "${pair%:*}" --features "${pair#*:}"
          done

      - name: Package and smoke test
        run: |
          set -euo pipefail
          bundle=dist/codeg-server-linux-x64
          mkdir -p "$bundle"
          for bin in codeg-server codeg-mcp codeg-computer-helper codeg-cli; do
            install -m 755 "src-tauri/target/x86_64-unknown-linux-gnu/release/$bin" "$bundle/$bin"
          done
          cp -r out "$bundle/web"
          "$bundle/codeg-server" --version
          "$bundle/codeg-mcp" --help > dist/mcp-help.txt
          grep -F 'codeg-mcp --parent-connection-id' dist/mcp-help.txt
          "$bundle/codeg-cli" --version
          "$bundle/codeg-cli" --help > dist/cli-help.txt
          grep -F 'Usage: codeg-cli' dist/cli-help.txt
          test -f "$bundle/web/index.html"
          tar -C dist -czf "$bundle.tar.gz" codeg-server-linux-x64
          (cd dist && sha256sum codeg-server-linux-x64.tar.gz > codeg-server-linux-x64.tar.gz.sha256)

      - name: Upload server bundle
        uses: actions/upload-artifact@v4
        with:
          name: codeg-server-linux-x64
          path: |
            dist/codeg-server-linux-x64.tar.gz
            dist/codeg-server-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
