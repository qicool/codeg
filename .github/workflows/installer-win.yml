name: Installer (Windows x64)

# Builds a Windows x64 NSIS installer from a branch of this fork, so a
# modified build can be installed and tried without the release pipeline's
# signing secrets. It is NOT the release path: no updater artifacts are
# produced and nothing is published — the installer is a workflow artifact.
on:
  push:
    branches:
      - feat/continue-session
  workflow_dispatch:

env:
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: installer-win-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-delegation:
    name: Delegation regression tests
    runs-on: ubuntu-22.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: test-ubuntu-22.04-server
      - name: Run delegation tests
        working-directory: src-tauri
        run: |
          cargo test --locked --no-default-features --features server-bin --lib acp::delegation
          cargo test --locked --no-default-features --features server-bin --lib continuation_reuses_idle_connection_and_cancels_only_its_turn
          cargo test --locked --no-default-features --features server-bin --lib acp::lifecycle

  build-installer:
    name: Windows x64 NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: installer-x86_64-pc-windows-msvc

      - name: Test Windows process tree cleanup
        timeout-minutes: 10
        run: cargo test --manifest-path src-tauri/vendor/kill_tree/Cargo.toml --lib common::tests

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `bundle.createUpdaterArtifacts` is true in tauri.conf.json and the
      # updater artifacts it produces must be signed with the release
      # pipeline's TAURI_SIGNING_PRIVATE_KEY. This build has no such key and
      # does not need one: the installer is installed by hand, not updated.
      - name: Turn off updater artifacts for this build
        shell: pwsh
        run: |
          $path = 'src-tauri/tauri.conf.json'
          $text = Get-Content -Raw $path
          $patched = $text -replace '"createUpdaterArtifacts":\s*true', '"createUpdaterArtifacts": false'
          if ($patched -eq $text) {
            throw "bundle.createUpdaterArtifacts: true not found in $path"
          }
          Set-Content -NoNewline -Encoding utf8 -Path $path -Value $patched

      # `beforeBuildCommand` (pnpm tauri:before-build) runs the static export
      # build and stages the sidecars — codeg-mcp, codeg-computer-helper and
      # codeg-cli — for the host triple. MSI is not requested: with
      # `externalBin` configured, light.exe fails (tauri-apps/tauri#14681), so
      # NSIS is the Windows installer the release pipeline ships too.
      - name: Build installer
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: codeg-windows-x64-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
